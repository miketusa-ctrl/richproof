# Public template. Replace every <PLACEHOLDER> with your own Cloudflare resource IDs
# (wrangler kv namespace create / wrangler d1 create). Rate-limit namespace IDs must be
# unique integers within your account. Secrets go in `wrangler secret put`, never here.

name = "richproof-staging"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true
preview_urls = false
[observability]
enabled = false

[limits]
cpu_ms = 100

[vars]
PUBLIC_LAUNCH = "false"
CHECK_LIMIT_PER_MIN = "30"
DAILY_CHECK_POOL = "20000"
DAILY_KV_WRITES = "2000"

[[unsafe.bindings]]
name = "CHECK_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_1>"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "MCP_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_2>"
simple = { limit = 120, period = 60 }

[[kv_namespaces]]
binding = "SG_KV"
id = "<KV_NAMESPACE_ID>"

[env.production]
name = "richproof"
workers_dev = true
preview_urls = false

[env.production.observability]
enabled = false

[env.production.limits]
cpu_ms = 100

[env.production.vars]
PUBLIC_LAUNCH = "true"
CHECK_LIMIT_PER_MIN = "30"
DAILY_CHECK_POOL = "20000"
DAILY_KV_WRITES = "2000"
MCP_REGISTRY_AUTH = ""

[[env.production.unsafe.bindings]]
name = "CHECK_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_3>"
simple = { limit = 30, period = 60 }

[[env.production.unsafe.bindings]]
name = "MCP_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_4>"
simple = { limit = 120, period = 60 }

[[env.production.kv_namespaces]]
binding = "SG_KV"
id = "<PRODUCTION_KV_NAMESPACE_ID>"
